packages:
  - apps/*
  - packages/*
catalog:
  typescript: 6.0.3
onlyBuiltDependencies:
  - "@sentry/cli"
  - "@tailwindcss/oxide"
  - canvas
  - core-js
  - electron
  - esbuild
  - unrs-resolver
patchedDependencies:
  canvas: patches/canvas.patch
# pdfjs-dist (a dev dependency for the export-diff harness) has an optional
# @napi-rs/canvas for rendering in plain Node; the harness renders in a browser.
ignoredOptionalDependencies:
  - "@napi-rs/canvas"
