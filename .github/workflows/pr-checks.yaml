name: PR Checks

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # Detect which files changed to conditionally skip jobs
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop_related }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            desktop_related:
              - 'apps/desktop/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
              - 'turbo.json'
              - '.github/workflows/**'
              - 'actions/**'

  basic-checks:
    strategy:
      matrix:
        pnpm-script:
          - format:check
          - lint
          - spellcheck
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0

      - name: Install project dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run check
        run: pnpm run ${{ matrix.pnpm-script}}

  test:
    needs: check-changes
    if: needs.check-changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0

      - name: Install project dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Build project
        run: pnpm run build

      - name: Test all packages
        run: pnpm run test

      - name: Test desktop with history
        working-directory: apps/desktop
        run: pnpm run test:history $(find . -type f -name "*.test.*" -exec grep -l "getTestWithHistory" {} +) --silent

  desktop-e2e:
    needs: check-changes
    if: needs.check-changes.outputs.desktop == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0

      - name: Install project dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Build monorepo
        run: pnpm run build

      # The web editor (editor.openmarch.com) shares the desktop app's code.
      - name: Build web editor
        working-directory: apps/desktop
        run: pnpm run web:build

      - name: Ensure Electron binary is installed
        run: node node_modules/electron/install.js

      - name: Run E2E tests
        working-directory: apps/desktop
        run: pnpm run e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: desktop-playwright-report-${{ github.run_number }}
          path: apps/desktop/playwright-report/
          retention-days: 30

  # Summary job for required status checks
  # Mark THIS job as required in GitHub branch protection settings
  all-checks-passed:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - basic-checks
      - test
      - desktop-e2e
    steps:
      - name: Check all job results
        run: |
          echo "basic-checks: ${{ needs.basic-checks.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "desktop-e2e: ${{ needs.desktop-e2e.result }}"

          # Fail if any job failed (skipped jobs are OK)
          if [[ "${{ needs.basic-checks.result }}" != "success" && "${{ needs.basic-checks.result }}" != "skipped" ]] || \
             [[ "${{ needs.test.result }}" != "success" && "${{ needs.test.result }}" != "skipped" ]] || \
             [[ "${{ needs.desktop-e2e.result }}" != "success" && "${{ needs.desktop-e2e.result }}" != "skipped" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi

          echo "All required checks passed or were skipped"
