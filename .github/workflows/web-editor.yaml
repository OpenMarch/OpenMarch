# Deploys the web editor (apps/desktop/web) to Cloudflare:
#
#   editor.openmarch.com/          stable, built from the latest published release
#   editor.openmarch.com/nightly/  nightly, built from every push to main
#
# Needs the CLOUDFLARE_API_TOKEN secret (Workers Scripts: Edit, Workers Routes:
# Edit, and Zone DNS: Edit on openmarch.com for the Custom Domain) and the
# CLOUDFLARE_ACCOUNT_ID variable. See apps/desktop/web/README.md.
name: Web Editor

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/web-editor.yaml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: "Which site to deploy"
        required: true
        type: choice
        options: [nightly, stable]
      ref:
        description: "Git ref to build (stable: a release tag, e.g. v0.2.0). Empty: main for nightly, the latest release for stable."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: web-editor-${{ github.event_name == 'release' && 'stable' || inputs.channel || 'nightly' }}
  cancel-in-progress: false

jobs:
  deploy:
    # Pre-releases don't go to the stable site.
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      CHANNEL: ${{ github.event_name == 'release' && 'stable' || inputs.channel || 'nightly' }}
    steps:
      - name: Choose the ref to build
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          REF="$INPUT_REF"
          if [ "${{ github.event_name }}" = "release" ]; then
            REF="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$REF" ] && [ "$CHANNEL" = "stable" ]; then
            REF="$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)"
          fi
          if [ -z "$REF" ]; then
            REF="${{ github.sha }}"
          fi
          echo "Building $CHANNEL from $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Check that this ref has the web editor
        run: |
          if [ ! -f apps/desktop/vite.web.config.mts ]; then
            echo "::error::${{ steps.ref.outputs.ref }} predates the web editor (no apps/desktop/vite.web.config.mts). Release a version that includes it."
            exit 1
          fi

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo run build --filter="@openmarch/desktop^..."

      - name: Build the web editor
        working-directory: apps/desktop
        env:
          WEB_CHANNEL: ${{ env.CHANNEL }}
          WEB_BASE: ${{ env.CHANNEL == 'nightly' && '/nightly/' || '/' }}
        run: pnpm run web:build

      - name: Deploy to Cloudflare
        working-directory: apps/desktop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$CHANNEL" = "nightly" ]; then
            pnpm exec wrangler deploy -c web/wrangler.jsonc --env nightly
          else
            pnpm exec wrangler deploy -c web/wrangler.jsonc
          fi
